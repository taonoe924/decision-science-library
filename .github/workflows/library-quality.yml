name: Decision Science Library quality gate
on:
  push:
    paths:
      - "assets/papers.js"
      - "assets/app.js"
      - "assets/digest-quality.js"
      - "data/digests/**"
      - "scripts/quality-audit.mjs"
      - "scripts/validate-library.mjs"
      - "scripts/test-digest-quality.mjs"
      - ".github/workflows/library-quality.yml"
  pull_request:
    paths:
      - "assets/papers.js"
      - "assets/app.js"
      - "assets/digest-quality.js"
      - "data/digests/**"
      - "scripts/quality-audit.mjs"
      - "scripts/validate-library.mjs"
      - "scripts/test-digest-quality.mjs"
      - ".github/workflows/library-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure-and-metadata:
    name: Validate papers, tables, links, and digest data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax checks
        run: |
          node --check assets/app.js
          node --check assets/digest-quality.js
          node --check assets/papers.js
          node --check scripts/quality-audit.mjs
          node --check scripts/validate-library.mjs
          node --check scripts/test-digest-quality.mjs
      - name: Test publication gate
        run: node scripts/test-digest-quality.mjs
      - name: Validate library data
        run: |
          node scripts/quality-audit.mjs
          node scripts/validate-library.mjs
